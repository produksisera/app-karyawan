<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Karyawan - Prodsera</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Poppins', sans-serif; }
        
        .navbar-custom { background-color: #1a252f; padding: 15px 0; }
        .navbar-brand { font-weight: 700; color: #ffde00 !important; font-size: 1.5rem; }
        .nav-link { font-weight: 500; color: #ffffff !important; margin: 0 5px; border-radius: 5px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background-color: #ffde00; color: #000000 !important; }
        
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: none; }
        .table-container { max-height: 65vh; overflow-y: auto; border-radius: 8px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        
        /* Desain Tabel Utama */
        .table thead th { background-color: #ffffff; color: #000000; text-align: center; position: sticky; top: 0; z-index: 1; border: 2px solid #000 !important; white-space: nowrap; }
        .table tbody td { text-align: center; vertical-align: middle; white-space: nowrap; border: 1px solid #000 !important; }
        .table tbody tr:hover { background-color: #e2e6ea !important; }
        
        /* Tema Gelap untuk HM, Absen, dan CTN */
        .header-gelap thead th { background-color: #2c3e50 !important; color: #ffffff !important; border: 1px solid #dee2e6 !important; }
        .header-gelap tbody td { border: 1px solid #dee2e6 !important; }

        .row-total { background-color: #ffde00 !important; }
        .row-total th { background-color: transparent !important; color: #000000 !important; font-weight: 700; font-size: 1.1rem; border: 1px solid #000 !important;}

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        #halamanData, #loadingData { display: none; }
        .login-container { padding-top: 10vh; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom d-none" id="menuNav">
    <div class="container">
        <a class="navbar-brand" href="#">PORTAL PRODSERA</a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="daftarMenu">
                <li class="nav-item"><a class="nav-link active" href="#" onclick="muatData('HM', this)">Data HM</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="muatData('INSENTIF', this)">Insentif</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="muatData('ABSEN', this)">Absen</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="muatData('CTN', this)">Sisa CTN</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <!-- TEMPAT NAMA KARYAWAN MUNCUL -->
                <span class="text-light me-3 fw-bold" id="infoKaryawanNav"></span>
                <button class="btn btn-danger btn-sm fw-bold px-3" onclick="logout()">Keluar</button>
            </div>
        </div>
    </div>
</nav>

<div class="container fade-in">
    <div class="row justify-content-center login-container" id="halamanLogin">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold" style="color: #2c3e50;">Masuk Akun</h3>
                    <p class="text-muted">Gunakan NRP dan Tanggal Lahir</p>
                </div>
                <div class="mb-3">
                    <label class="fw-semibold mb-1">NRP</label>
                    <input type="number" id="inputNrp" class="form-control form-control-lg" placeholder="NRP 8 Digit, Contoh: 01112345">
                </div>
                <div class="mb-4">
                    <label class="fw-semibold mb-1">Tanggal Lahir</label>
                    <input type="number" id="inputTglLahir" class="form-control form-control-lg" placeholder="Contoh: 170845">
                </div>
                <button onclick="login()" class="btn btn-primary btn-lg w-100 fw-bold" id="btnLogin" style="background-color: #0056b3; border:none;">
                    <span id="btnText">Masuk Portal</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
                <div id="pesanError" class="text-danger mt-3 text-center fw-semibold"></div>
            </div>
        </div>
    </div>

    <div id="loadingData" class="text-center mt-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <h4 class="mt-3 text-muted">Mengambil data dari server...</h4>
    </div>

    <div id="halamanData" class="mt-4 fade-in">
        <!-- HEADER HALAMAN & DROPDOWN FILTER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
            <h3 class="fw-bold mb-2 mb-md-0" style="color: #2c3e50;" id="judulHalaman">Data HM</h3>
            <select id="filterBulan" class="form-select w-auto d-none shadow-sm border-dark fw-semibold" onchange="terapkanFilter()">
                <option value="SEMUA">Semua Bulan</option>
            </select>
        </div>

        <div class="card p-0 overflow-hidden">
            <div class="table-container">
                <table class="table mb-0 header-gelap" id="tabelUtama">
                    <thead id="tabelHeader"></thead>
                    <tbody id="tabelBody"></tbody>
                    <tfoot id="tabelFooter"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ⚠️ GANTI DENGAN URL APPS SCRIPT ANDA YANG BARU
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbxmhXBjnRevimNXyDbqh8s-chCG3psuNJDwKLY8slLiBhONWfSTFIZB13yDqZ4FZm3J/exec";

    let sesiNrp = "";
    let sesiTglLahir = "";
    
    // Variabel Global
    window.dataAsli = [];
    window.headersAsli = [];
    window.jenisDataAktif = "";

    function login() {
        const nrp = document.getElementById("inputNrp").value;
        const tglLahir = document.getElementById("inputTglLahir").value;
        const pesan = document.getElementById("pesanError");
        const btn = document.getElementById("btnLogin");

        if(!nrp || !tglLahir) { pesan.innerText = "NRP dan Tanggal Lahir tidak boleh kosong!"; return; }

        pesan.innerText = "";
        document.getElementById("btnText").innerText = " Memeriksa Kredensial...";
        document.getElementById("btnSpinner").classList.remove("d-none");
        btn.disabled = true;

        fetch(`${urlGoogleScript}?nrp=${nrp}&tglLahir=${tglLahir}&jenis=HM`)
            .then(response => response.json())
            .then(hasil => {
                document.getElementById("btnText").innerText = "Masuk Portal";
                document.getElementById("btnSpinner").classList.add("d-none");
                btn.disabled = false;

                if (hasil.status === 'sukses') {
                    sesiNrp = nrp;
                    sesiTglLahir = tglLahir;
                    document.getElementById("halamanLogin").style.display = "none";
                    document.getElementById("menuNav").classList.remove("d-none");
                    
                    let nama = hasil.nama ? hasil.nama : "";
                    document.getElementById("infoKaryawanNav").innerText = `Halo, ${nama} (${nrp})`;
                    
                    window.dataAsli = hasil.data;
                    window.headersAsli = hasil.headers;
                    window.jenisDataAktif = 'HM';

                    setupDropdownBulan(hasil.headers, hasil.data);
                    tampilkanTabelDinamis('Data HM', hasil.headers, hasil.data, 'HM');
                } else {
                    pesan.innerText = hasil.pesan; 
                }
            }).catch(error => {
                document.getElementById("btnText").innerText = "Masuk Portal";
                document.getElementById("btnSpinner").classList.add("d-none");
                btn.disabled = false;
                pesan.innerText = "Gagal terhubung. Periksa koneksi internet Anda.";
            });
    }

    function muatData(jenisData, elemenMenu) {
        document.querySelectorAll('.nav-link').forEach(menu => menu.classList.remove('active'));
        if (elemenMenu) elemenMenu.classList.add('active');

        let judul = "Data " + jenisData;
        if(jenisData === 'CTN') judul = "Data Sisa CTN";
        else if (jenisData === 'INSENTIF') judul = "Data Insentif Tambahan";

        document.getElementById("halamanData").style.display = "none";
        document.getElementById("loadingData").style.display = "block";
        document.getElementById("filterBulan").classList.add("d-none"); 

        fetch(`${urlGoogleScript}?nrp=${sesiNrp}&tglLahir=${sesiTglLahir}&jenis=${jenisData}`)
            .then(response => response.json())
            .then(hasil => {
                document.getElementById("loadingData").style.display = "none";
                if (hasil.status === 'sukses') {
                    window.dataAsli = hasil.data;
                    window.headersAsli = hasil.headers;
                    window.jenisDataAktif = jenisData;

                    setupDropdownBulan(hasil.headers, hasil.data);
                    tampilkanTabelDinamis(judul, hasil.headers, hasil.data, jenisData);
                }
                else { alert("Error: " + hasil.pesan); document.getElementById("halamanData").style.display = "block"; }
            }).catch(error => { document.getElementById("loadingData").style.display = "none"; alert("Gagal mengambil data."); });
    }

    // --- FUNGSI BARU: Mengubah format tanggal tampil ---
    function formatTanggalTampil(tglString) {
        if (!tglString) return "";
        let str = String(tglString).trim();
        
        // Cek jika formatnya MM/DD/YY atau MM/DD/YYYY (contoh: 08/01/26 -> 1 Agustus 2026)
        let regexBulanHariTahun = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/;
        let match = str.match(regexBulanHariTahun);
        
        if (match) {
            let bulan = match[1].padStart(2, '0'); // Mengambil bulan
            let hari = match[2].padStart(2, '0');  // Mengambil hari
            let tahun = match[3];
            if (tahun.length === 4) tahun = tahun.slice(-2); // Potong jadi 2 digit terakhir (2026 -> 26)
            
            return `${hari}/${bulan}/${tahun}`; // Hasil akhir: DD/MM/YY (01/08/26)
        }
        
        // Cek jika Apps Script mengirimkan string waktu Date bawaan sistem: "2026-08-01T..."
        if (str.includes("-") && str.includes("T") && str.includes("Z")) {
            let d = new Date(str);
            if (!isNaN(d.getTime())) {
                let hari = d.getDate().toString().padStart(2, '0');
                let bulan = (d.getMonth() + 1).toString().padStart(2, '0');
                let tahun = d.getFullYear().toString().slice(-2);
                return `${hari}/${bulan}/${tahun}`;
            }
        }
        
        return str; // Kembalikan bentuk aslinya jika tidak terdeteksi butuh diubah (misal sudah 1-Aug-26)
    }

    function ekstrakBulanTahun(tglStr) {
        if (!tglStr) return "";
        let str = String(tglStr).trim();

        let parts = str.split('-');
        if (parts.length === 3 && isNaN(parts[1])) {
            return parts[1] + '-' + parts[2]; 
        }

        let d = new Date(str);
        if (!isNaN(d.getTime())) {
            let month = d.toLocaleString('en-US', { month: 'short' }); 
            let year = d.getFullYear().toString().slice(-2); 
            return `${month}-${year}`;
        }
        return str; 
    }

    function setupDropdownBulan(headers, data) {
        const filterBulan = document.getElementById("filterBulan");
        filterBulan.innerHTML = '<option value="SEMUA">Tampilkan Semua Bulan</option>';
        
        let idxTanggal = headers.findIndex(h => {
            let nama = h.toString().toUpperCase().trim();
            return ["DATE", "TANGGAL", "BULAN", "PERIODE"].includes(nama);
        });

        if (idxTanggal !== -1 && data.length > 0) {
            let uniqueMonths = new Set();
            
            data.forEach(row => {
                let val = row[idxTanggal];
                if (val) {
                    let bulanTahun = ekstrakBulanTahun(val);
                    if (bulanTahun) uniqueMonths.add(bulanTahun);
                }
            });

            if (uniqueMonths.size > 0) {
                let arrMonths = Array.from(uniqueMonths);
                arrMonths.forEach(bulan => {
                    let option = document.createElement("option");
                    option.value = bulan;
                    option.innerText = bulan;
                    filterBulan.appendChild(option);
                });
                
                filterBulan.classList.remove("d-none");
                return;
            }
        }
        filterBulan.classList.add("d-none");
    }

    function terapkanFilter() {
        let bulanDipilih = document.getElementById("filterBulan").value;
        let dataTerfilter = window.dataAsli;

        if (bulanDipilih !== "SEMUA") {
            let idxTanggal = window.headersAsli.findIndex(h => {
                let nama = h.toString().toUpperCase().trim();
                return ["DATE", "TANGGAL", "BULAN", "PERIODE"].includes(nama);
            });

            if (idxTanggal !== -1) {
                dataTerfilter = window.dataAsli.filter(row => {
                    let val = row[idxTanggal];
                    return val && ekstrakBulanTahun(val) === bulanDipilih;
                });
            }
        }

        let judul = document.getElementById("judulHalaman").innerText;
        tampilkanTabelDinamis(judul, window.headersAsli, dataTerfilter, window.jenisDataAktif);
    }

    function tampilkanTabelDinamis(judul, headers, data, jenisData) {
        document.getElementById("halamanData").style.display = "block";
        document.getElementById("judulHalaman").innerText = judul;
        
        const tabelUtama = document.getElementById("tabelUtama");
        if (jenisData === 'INSENTIF') tabelUtama.classList.remove("header-gelap");
        else tabelUtama.classList.add("header-gelap");

        const thead = document.getElementById("tabelHeader");
        const tbody = document.getElementById("tabelBody");
        const tfoot = document.getElementById("tabelFooter");
        
        // -------------------------------------------------------------
        // BLOK 1: LOGIKA KHUSUS UNTUK DATA INSENTIF (67 KOLOM)
        // -------------------------------------------------------------
        if (jenisData === 'INSENTIF') {
            thead.innerHTML = `<tr>
                <th style="background-color: #fff; color: #000; border: 2px solid #000 !important;">TANGGAL</th>
                <th style="background-color: #fff; color: #000; border: 2px solid #000 !important;">PEROLEHAN INSENTIF</th>
                <th style="background-color: #fff; color: #000; border: 2px solid #000 !important;">KETERANGAN</th>
            </tr>`;
            
            let barisBody = "";
            if (data.length === 0) {
                barisBody = `<tr><td colspan="3" class="text-center py-4 text-muted fw-bold">Tidak ada data untuk bulan terpilih.</td></tr>`;
            } else {
                let dt = data[0]; 
                
                for(let i = 2; i <= 32; i++) { 
                    let tgl = headers[i];
                    if(tgl && String(tgl).trim() !== "") {
                        let insentif = String(dt[i]).trim();
                        if(insentif === "" || insentif === "0") insentif = "-";
                        
                        let ketIndex = i + 32; 
                        let ket = String(dt[ketIndex]).trim();
                        if(ket === "0" || ket === "" || ket.includes("1899")) ket = "-";

                        barisBody += `<tr>
                            <td style="border: 1px solid #000;">${tgl}</td>
                            <td style="border: 1px solid #000;">${insentif}</td>
                            <td style="border: 1px solid #000;">${ket}</td>
                        </tr>`;
                    }
                }
            }
            tbody.innerHTML = barisBody;

            if (data.length > 0) {
                let dt = data[0];
                tfoot.innerHTML = `
                    <tr><td colspan="3" style="border: none !important; height: 30px;"></td></tr>
                    <tr class="row-total">
                        <th colspan="2" class="text-end" style="border: 2px solid #000 !important;">TOTAL</th>
                        <th class="text-center" style="border: 2px solid #000 !important;">${String(dt[33]).trim()}</th>
                    </tr>
                    <tr>
                        <th colspan="2" class="text-end" style="background-color: #fff !important; color: #000 !important; border: 2px solid #000 !important;">${String(headers[65]).trim()}</th>
                        <th class="text-center" style="background-color: #fff !important; color: #000 !important; border: 2px solid #000 !important;">${String(dt[65]).trim()}</th>
                    </tr>
                `;
            } else {
                tfoot.innerHTML = "";
            }
            return;
        }

        // -------------------------------------------------------------
        // BLOK 2: LOGIKA UMUM UNTUK HM, ABSEN, DAN CTN
        // -------------------------------------------------------------
        let indeksSembunyi = [];
        let indexHmTotal = -1;
        let barisHeader = "<tr>";
        let jumlahKolomTampil = 0;

        headers.forEach((namaKolom, index) => {
            let judulKolom = namaKolom.toString().toUpperCase().trim();
            if (judulKolom === "TGL LAHIR" || judulKolom === "TANGGAL LAHIR") {
                indeksSembunyi.push(index);
            } else {
                barisHeader += `<th>${namaKolom}</th>`; 
                jumlahKolomTampil++;
                if (judulKolom === "HM TOTAL") indexHmTotal = index;
            }
        });
        barisHeader += "</tr>";
        thead.innerHTML = barisHeader;

        let barisBody = "";
        let totalNilaiHm = 0;

        if (data.length === 0) {
            barisBody = `<tr><td colspan="${jumlahKolomTampil}" class="text-center py-4 text-muted fw-bold">Tidak ada data untuk bulan terpilih.</td></tr>`;
        } else {
            data.forEach(baris => {
                barisBody += "<tr>";
                baris.forEach((sel, index) => {
                    if (!indeksSembunyi.includes(index)) {
                        let teksSel = String(sel).trim();
                        let judulKolom = headers[index].toString().toUpperCase();
                        
                        // 1. TERAPKAN FORMAT TANGGAL KHUSUS UNTUK KOLOM DATE / TANGGAL
                        if (["DATE", "TANGGAL", "BULAN", "PERIODE"].includes(judulKolom)) {
                            teksSel = formatTanggalTampil(teksSel);
                        }
                        
                        // 2. Pembersihan teks KET atau 0
                        if ((judulKolom.includes("KET") || judulKolom.includes("STATUS")) && (teksSel === "0" || teksSel === "0:00" || teksSel === "00:00" || teksSel.includes("1899"))) {
                            teksSel = "-";
                        }
                        
                        if (index === indexHmTotal) {
                            let angka = parseFloat(teksSel);
                            if (!isNaN(angka)) totalNilaiHm += angka;
                            barisBody += `<td><strong>${teksSel}</strong></td>`;
                        } else {
                            barisBody += `<td>${teksSel}</td>`;
                        }
                    }
                });
                barisBody += "</tr>";
            });
        }
        tbody.innerHTML = barisBody;

        if (indexHmTotal !== -1 && data.length > 0) {
            let barisFooter = "<tr class='row-total'>";
            headers.forEach((namaKolom, index) => {
                if (!indeksSembunyi.includes(index)) {
                    if (index === indexHmTotal - 1) barisFooter += `<th class="text-end">JUMLAH TOTAL:</th>`;
                    else if (index === indexHmTotal) barisFooter += `<th>${totalNilaiHm.toFixed(2)}</th>`; 
                    else barisFooter += `<th></th>`;
                }
            });
            barisFooter += "</tr>"; 
            tfoot.innerHTML = barisFooter;
        } else {
            tfoot.innerHTML = "";
        }
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
