<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Karyawan - Cek Data HM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #f0f2f5; 
            font-family: 'Poppins', sans-serif;
            padding-top: 5vh; 
            padding-bottom: 5vh;
        }
        
        .card { 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border: none;
        }
        
        .table-container {
            max-height: 65vh; 
            overflow-y: auto;
            border-radius: 8px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }
        .table thead th { 
            background-color: #2c3e50; 
            color: #ffffff; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 1;
            white-space: nowrap;
        }
        .table td { 
            text-align: center; 
            vertical-align: middle; 
            white-space: nowrap;
        }
        
        .table tbody tr {
            transition: all 0.2s ease;
        }
        .table tbody tr:hover {
            background-color: #e2e6ea !important;
            transform: scale(1.01);
        }
        
        /* PERBAIKAN: Menghapus efek sticky di bawah agar tidak menutupi data */
        .row-total {
            background-color: #ffde00 !important; 
        }
        .row-total th {
            background-color: transparent !important;
            color: #000000 !important; 
            font-weight: 700;
            font-size: 1.1rem;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #halamanData { display: none; }
    </style>
</head>
<body>

<div class="container fade-in">
    
    <div class="row justify-content-center" id="halamanLogin">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold" style="color: #2c3e50;">Portal Karyawan</h3>
                    <p class="text-muted">Masukkan kredensial Anda untuk melihat data HM</p>
                </div>
                
                <div class="mb-3">
                    <label class="fw-semibold mb-1">NRP</label>
                    <input type="number" id="inputNrp" class="form-control form-control-lg" placeholder="Contoh: 01112345">
                </div>
                <div class="mb-4">
                    <label class="fw-semibold mb-1">Tanggal Lahir</label>
                    <input type="number" id="inputTglLahir" class="form-control form-control-lg" placeholder="Contoh: 170845">
                </div>
                
                <button onclick="login()" class="btn btn-primary btn-lg w-100 fw-bold" id="btnLogin" style="background-color: #0056b3; border:none;">
                    <span id="btnText">Masuk & Cari Data</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
                
                <div id="pesanError" class="text-danger mt-3 text-center fw-semibold"></div>
            </div>
        </div>
    </div>

    <div id="halamanData" class="fade-in">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0" style="color: #2c3e50;">Data HM</h3>
                <p class="text-muted m-0" id="infoKaryawan"></p>
            </div>
            <button onclick="logout()" class="btn btn-outline-danger mt-3 mt-md-0 fw-bold px-4">Keluar</button>
        </div>
        
        <div class="card p-0 overflow-hidden">
            <div class="table-container">
                <table class="table table-bordered mb-0">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>NRP</th>
                            <th>NAMA KARYAWAN</th>
                            <th>SETTINGAN</th>
                            <th>KODE Shift (1)</th>
                            <th>NO UNIT</th>
                            <th>HM AWAL</th>
                            <th>HM AKHIR</th>
                            <th>HM TOTAL</th>
                            <th>KET</th>
                        </tr>
                    </thead>
                    <tbody id="isiTabel">
                    </tbody>
                    <tfoot>
                        <tr class="row-total">
                            <th colspan="8" class="text-end">JUMLAH TOTAL HM:</th>
                            <th id="totalHmBawah">0</th>
                            <th></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // ⚠️ MASUKKAN KEMBALI URL APPS SCRIPT ANDA DI SINI
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycby_UBuuUA1oJ-tWS05-R9hxRzVqplggogpLJHwz1XYGTj3LB-bH8Z-12mjtOyizsRPz/exec";

    function login() {
        const nrp = document.getElementById("inputNrp").value;
        const tglLahir = document.getElementById("inputTglLahir").value;
        const pesan = document.getElementById("pesanError");
        
        const btn = document.getElementById("btnLogin");
        const btnText = document.getElementById("btnText");
        const btnSpinner = document.getElementById("btnSpinner");

        if(!nrp || !tglLahir) {
            pesan.innerText = "NRP dan Tanggal Lahir tidak boleh kosong!";
            return;
        }

        pesan.innerText = "";
        btnText.innerText = " Memproses...";
        btnSpinner.classList.remove("d-none");
        btn.disabled = true;

        fetch(`${urlGoogleScript}?nrp=${nrp}&tglLahir=${tglLahir}`)
            .then(response => response.json())
            .then(hasil => {
                btnText.innerText = "Masuk & Cari Data";
                btnSpinner.classList.add("d-none");
                btn.disabled = false;

                if (hasil.status === 'sukses') {
                    tampilkanData(hasil.data, hasil.total_semua);
                } else {
                    pesan.innerText = hasil.pesan;
                }
            })
            .catch(error => {
                btnText.innerText = "Masuk & Cari Data";
                btnSpinner.classList.add("d-none");
                btn.disabled = false;
                pesan.innerText = "Gagal terhubung ke server. Periksa koneksi internet Anda.";
            });
    }

    function tampilkanData(data, totalHm) {
        document.getElementById("halamanLogin").style.display = "none";
        document.getElementById("halamanData").style.display = "block";
        
        document.getElementById("infoKaryawan").innerText = `NRP: ${data[0].nrp} | Nama: ${data[0].nama}`;
        
        let barisTabel = "";
        data.forEach(item => {
            
            // PERBAIKAN: Format ulang kolom "Ket"
            let teksKet = String(item.ket).trim();
            // Jika berisi "0", "0:00", "00:00", atau kode waktu error (1899), maka dikosongkan
            if (teksKet === "0" || teksKet === "0:00" || teksKet === "00:00" || teksKet.includes("1899") || teksKet === "") {
                teksKet = ""; 
            }

            barisTabel += `
                <tr>
                    <td>${item.date}</td>
                    <td>${item.nrp}</td>
                    <td>${item.nama}</td>
                    <td>${item.settingan}</td>
                    <td>${item.kodeShift}</td>
                    <td>${item.noUnit}</td>
                    <td>${item.hmAwal}</td>
                    <td>${item.hmAkhir}</td>
                    <td><strong>${item.hmTotal}</strong></td>
                    <td>${teksKet}</td>
                </tr>
            `;
        });
        
        document.getElementById("isiTabel").innerHTML = barisTabel;
        document.getElementById("totalHmBawah").innerText = totalHm;
    }

    function logout() {
        document.getElementById("halamanData").style.display = "none";
        const halLogin = document.getElementById("halamanLogin");
        halLogin.style.display = "flex";
        
        document.getElementById("inputNrp").value = "";
        document.getElementById("inputTglLahir").value = "";
        document.getElementById("isiTabel").innerHTML = "";
        document.getElementById("pesanError").innerText = "";
    }
</script>
</body>
</html>
